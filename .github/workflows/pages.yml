name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      run: |
        npm install
        cd project && npm install
    - name: Build
      run: |
        npm run build
    - name: Verify build output
      run: |
        if [ ! -d "project/dist" ]; then
          echo "Build failed: project/dist directory not found"
          exit 1
        fi
        echo "Build successful! Found project/dist directory"
        ls -la project/dist/
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: project/dist
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4