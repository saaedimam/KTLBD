name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          cd project && npm install

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "project/dist" ]; then
            echo "Build failed: project/dist directory not found"
            exit 1
          fi
          echo "Build successful! Found project/dist directory"
          echo "Build size: $(du -sh project/dist/)"
          ls -la project/dist/

      - name: Check Vercel secrets
        id: check-secrets
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_ORG_ID }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "secrets-available=true" >> $GITHUB_OUTPUT
            echo "✅ Vercel secrets are configured"
          else
            echo "secrets-available=false" >> $GITHUB_OUTPUT
            echo "⚠️ Vercel secrets not configured, skipping deployment"
          fi

      - name: Deploy to Vercel
        if: steps.check-secrets.outputs.secrets-available == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deployment skipped
        if: steps.check-secrets.outputs.secrets-available == 'false'
        run: |
          echo "ℹ️ Vercel deployment skipped - secrets not configured"
          echo "To enable deployment, configure these repository secrets:"
          echo "- VERCEL_TOKEN"
          echo "- VERCEL_ORG_ID" 
          echo "- VERCEL_PROJECT_ID"
          echo ""
          echo "Or deploy manually from Vercel dashboard"