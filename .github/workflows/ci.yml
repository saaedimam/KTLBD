name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Install project deps
        working-directory: project
        run: npm install

      - name: Lint (root)
        run: npm run lint

      - name: Build (root)
        run: npm run build

      - name: Lint (project)
        working-directory: project
        run: npm run lint

      - name: Build (project)
        working-directory: project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful! Found dist directory"

